services:
  api:
    build:
      context: .
      target: base
    # 宿主机端口由 API_PORT 覆盖，未设置时回退到 8000；容器内恒为 8000。
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s

  # 一次性验收：跑单元测试 + 对在线 API 执行验收清单，结束后退出。
  verify:
    build:
      context: .
      target: verify
    command:
      - sh
      - -c
      - "pytest && python scripts/acceptance.py"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
